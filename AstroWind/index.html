<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="./assets/images/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

<body class="bg-[#030620]">
    <nav id="navbar"

        <div class="left-nav text-[20px] font-bold">
            🚀 AstroWind
        </div>


        <div class="center-nav text-white flex gap-[30px]">
            <a href="#" class="">Home<i class="fa-solid fa-angle-down"></i></a>
            <a href="#" class="">Pages<i class="fa-solid fa-angle-down"></i></a>
            <a href="#" class="">Landing<i class="fa-solid fa-angle-down"></i></a>

        <div class="right-nav text-white flex items-center gap-[20px]">
            <a href="#" class="p-[6px] hover:bg-gray-600 rounded-md">

                    <symbol id="ai:tabler:sun">

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
			integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer" />
		<link rel="stylesheet" href="output.css" />
	</head>
	<body>
		<div class="flex justify-center items-center h-screen">
			<div class="relative flex justify-between items-center w-[635px] h-83">
				<!-- Background Image -->
				<img
					src="img/bg.jpg"
					alt=""
					class="absolute inset-0 w-full h-full object-cover opacity-35" />

				<!-- Main Content -->
				<div
					class="container relative flex justify-between items-center w-[620px] h-80 gap-8 rounded-lg overflow-hidden bg-white z-10 ml-[7px]">
					<!-- Left Image Section -->
					<div
						class="left h-full w-[50%] rounded-tl-lg rounded-bl-lg overflow-hidden">
						<img class="w-full h-full object-cover" src="img/ja.jpeg" alt="" />
					</div>

					<!-- Right Content Section -->
					<div class="right mt-[5px] pr-8 w-[500px]">
						<div class="head flex justify-between font-bold">
							<h1 class="text-xl">Classic Utility Jacket</h1>
							<p class="text-xl text-gray-400">$110.00</p>
						</div>
						<p class="mt-[10px]">In stock</p>

						<div class="size flex gap-5 mt-5 mb-5">
							<span class="bg-black text-white p-2 rounded-lg font-bold"
								>XS</span
							>
							<span class="p-2">S</span>
							<span class="p-2">M</span>
							<span class="p-2">L</span>
							<span class="p-2">XL</span>
						</div>
						<hr />
						<div class="btn mt-5 mb-4 flex gap-4 font-bold">
							<button
								class="bg-black text-white px-5 py-2 rounded-lg hover:bg-gray-400">
								Buy now
							</button>
							<button
								class="border border-gray-300 text-gray-600 px-5 py-2 rounded-lg hover:bg-gray-400">
								Add to bag
							</button>
							<button
								class="border border-gray-300 text-gray-600 px-3 py-2 rounded-lg hover:bg-gray-400 ml-[25px]">
								<i class="fa-solid fa-heart"></i>
							</button>
						</div>
						<p class="text-sm text-gray-400 mt-[30px]">
							Free Shipping on all continental US orders
						</p>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
